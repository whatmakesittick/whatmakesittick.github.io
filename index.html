<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="description" content="{{description}}" data-i18n-attr="content:catalogue.tagline" />
    <title data-i18n="catalogue.metaTitle">{{documentTitle}}</title>
    <link rel="canonical" href="{{url}}" />
    {{alternateLinks}}
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{url}}" />
    <meta property="og:site_name" content="{{siteName}}" />
    <meta property="og:title" content="{{title}}" data-i18n-attr="content:catalogue.title" />
    <meta
      property="og:description"
      content="{{description}}"
      data-i18n-attr="content:catalogue.tagline"
    />
    <meta property="og:image" content="{{image}}" />
    <meta property="og:image:type" content="{{imageType}}" />
    <meta property="og:image:width" content="{{imageWidth}}" />
    <meta property="og:image:height" content="{{imageHeight}}" />
    <meta property="og:image:alt" content="{{imageAlt}}" />
    {{localeTags}}
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" data-i18n-attr="content:catalogue.title" />
    <meta
      name="twitter:description"
      content="{{description}}"
      data-i18n-attr="content:catalogue.tagline"
    />
    <meta name="twitter:image" content="{{image}}" />
    <meta name="twitter:image:alt" content="{{imageAlt}}" />
    <script type="application/ld+json">
      {{structuredData}}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#catalogue" data-i18n="catalogue.skipLink">
      Skip to the explainers
    </a>

    <div class="catalogue-page">
      <header class="masthead">
        <div class="masthead-row">
          <p class="eyebrow" data-i18n="catalogue.eyebrow">Interactive explainers</p>
          <!-- partial:header-actions -->
        </div>
        <h1 data-i18n="catalogue.title">What makes it tick</h1>
        <p class="tagline" data-i18n="catalogue.tagline">
          How everyday machines work, taken apart in 3D and slowed right down so you can watch every
          part do its job.
        </p>
      </header>

      <main
        id="catalogue"
        class="catalogue"
        data-catalogue
        aria-label="Explainers"
        data-i18n-attr="aria-label:catalogue.listLabel"
      >
        {{catalogue}}
      </main>

      <!-- partial:footer -->
    </div>

    <script type="module" src="/src/site/main.ts"></script>
  </body>
</html>
