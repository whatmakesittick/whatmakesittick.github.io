<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d10" />
    <meta
      name="description"
      content="How everyday machines work, taken apart in 3D and slowed right down so you can watch every part do its job."
      data-i18n-attr="content:catalogue.tagline"
    />
    <title data-i18n="catalogue.title">What makes it tick</title>
    <link rel="canonical" href="{{siteUrl}}" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{siteUrl}}" />
    <meta property="og:site_name" content="{{siteName}}" />
    <meta property="og:title" content="{{siteName}}" />
    <meta
      property="og:description"
      content="How everyday machines work, taken apart in 3D and slowed right down so you can watch every part do its job."
      data-i18n-attr="content:catalogue.tagline"
    />
    <meta property="og:image" content="{{siteUrl}}social/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Cutaway 3D model of an inline four engine with labelled parts, beside the title What makes it tick"
    />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{siteName}}" />
    <meta
      name="twitter:description"
      content="How everyday machines work, taken apart in 3D and slowed right down so you can watch every part do its job."
      data-i18n-attr="content:catalogue.tagline"
    />
    <meta name="twitter:image" content="{{siteUrl}}social/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Cutaway 3D model of an inline four engine with labelled parts, beside the title What makes it tick"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <a class="skip-link" href="#catalogue" data-i18n="catalogue.skipLink">
      Skip to the explainers
    </a>

    <div class="catalogue-page">
      <header class="masthead">
        <div class="masthead-row">
          <p class="eyebrow" data-i18n="catalogue.eyebrow">Interactive explainers</p>
          <!-- partial:header-actions -->
        </div>
        <h1 data-i18n="catalogue.title">What makes it tick</h1>
        <p class="tagline" data-i18n="catalogue.tagline">
          How everyday machines work, taken apart in 3D and slowed right down so you can watch every
          part do its job.
        </p>
      </header>

      <main
        id="catalogue"
        class="catalogue"
        data-catalogue
        aria-label="Explainers by category"
        data-i18n-attr="aria-label:catalogue.listLabel"
      ></main>

      <!-- partial:footer -->
    </div>

    <script type="module" src="/src/site/main.ts"></script>
  </body>
</html>
