<!doctype html>
<html lang="{{lang}}">
  <head>
    <meta charset="UTF-8" />
    {{languageRedirect}}
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d10" />
    <meta name="description" content="{{description}}" data-i18n-attr="content:meta.description" />
    <title data-i18n="page.metaTitle" data-i18n-values="title:meta.title">{{documentTitle}}</title>
    <link rel="canonical" href="{{url}}" />
    {{alternateLinks}} {{feedLink}}
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta property="og:type" content="article" />
    <meta property="article:published_time" content="{{published}}" />
    <meta property="article:modified_time" content="{{modified}}" />
    <meta property="og:url" content="{{url}}" />
    <meta property="og:site_name" content="{{siteName}}" />
    <meta property="og:title" content="{{title}}" data-i18n-attr="content:meta.title" />
    <meta
      property="og:description"
      content="{{description}}"
      data-i18n-attr="content:meta.description"
    />
    <meta property="og:image" content="{{image}}" />
    <meta property="og:image:type" content="{{imageType}}" />
    <meta property="og:image:width" content="{{imageWidth}}" />
    <meta property="og:image:height" content="{{imageHeight}}" />
    <meta property="og:image:alt" content="{{imageAlt}}" />
    {{localeTags}}
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{title}}" data-i18n-attr="content:meta.title" />
    <meta
      name="twitter:description"
      content="{{description}}"
      data-i18n-attr="content:meta.description"
    />
    <meta name="twitter:image" content="{{image}}" />
    <meta name="twitter:image:alt" content="{{imageAlt}}" />
    <script type="application/ld+json">
      {{structuredData}}
    </script>
    {{analytics}}
    <noscript>
      <style>
        .language-select,
        .stage-expand,
        .gauge {
          display: none;
        }
      </style>
    </noscript>
  </head>
  <body>
    <a class="skip-link" href="#explainer" data-i18n="page.skipLink">Skip to the explanation</a>

    <div class="page">
      <header class="masthead">
        <!-- partial:site-link -->
        <div class="masthead-row">
          <p class="eyebrow" data-i18n="meta.eyebrow">{{eyebrow}}</p>
          <!-- partial:header-actions -->
        </div>
        <h1 data-i18n="meta.title">{{title}}</h1>
        <p class="tagline" data-i18n="meta.tagline">{{tagline}}</p>
      </header>

      <section
        class="stage"
        data-stage
        aria-label="Interactive model"
        data-i18n-attr="aria-label:stage.label"
      >
        <div id="scene">
          <noscript>
            <img
              class="stage-cover"
              src="{{coverUrl}}"
              width="{{coverWidth}}"
              height="{{coverHeight}}"
              alt="{{coverAlt}}"
            />
          </noscript>
        </div>

        <button
          type="button"
          class="stage-expand"
          data-control="expand"
          aria-pressed="false"
          aria-keyshortcuts="X"
          aria-label="Show the model full screen"
          title="Show the model full screen"
          data-i18n-attr="aria-label:stage.expand;title:stage.expand"
        >
          <svg class="icon icon-expand" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" />
          </svg>
          <svg class="icon icon-collapse" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 4v5H4M15 4v5h5M20 15h-5v5M4 15h5v5" />
          </svg>
        </button>

        <!-- partial:gauge -->

        <!-- partial:dock -->
      </section>

      <main id="explainer" class="prose">
        {{chapters}}

        <nav class="more-explainers" aria-labelledby="more-explainers-title">
          <h2
            id="more-explainers-title"
            class="more-explainers-title"
            data-i18n="page.moreExplainers"
          >
            More explainers
          </h2>
          <ul class="more-explainers-list">
            {{moreExplainers}}
          </ul>
        </nav>
      </main>

      <!-- partial:footer -->
    </div>

    <script type="module" src="{{entry}}"></script>
  </body>
</html>
