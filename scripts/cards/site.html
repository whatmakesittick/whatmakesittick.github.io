<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>What makes it tick: social card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=JetBrains+Mono:wght@500&display=swap"
    />
    <style>
      :root {
        --background: #0b0d10;
        --glow: #1a2230;
        --text: #e6e9ee;
        --prose: #c3c9d2;
        --muted: #8b929c;
        --accent: #f5a524;
      }

      body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        box-sizing: border-box;
        width: 1200px;
        height: 630px;
        margin: 0;
        padding: 64px 72px;
        overflow: hidden;
        color: var(--text);
        background: radial-gradient(
          ellipse 70% 60% at 50% 0%,
          var(--glow) 0%,
          var(--background) 70%
        );
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .title {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 26px;
        padding-top: 24px;
        text-align: center;
      }

      .mark {
        width: 132px;
        height: 132px;
      }

      h1 {
        margin: 0;
        font-size: 72px;
        font-weight: 700;
        line-height: 1;
        letter-spacing: -0.035em;
      }

      h1 span {
        color: var(--accent);
      }

      .subtitle {
        margin: 0;
        color: var(--prose);
        font-size: 30px;
        font-weight: 500;
        line-height: 1.3;
      }

      .footer {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .timeline {
        position: relative;
        display: flex;
        flex-grow: 1;
        gap: 4px;
        height: 10px;
      }

      .timeline span {
        flex-grow: var(--grow);
        background: var(--color);
      }

      .timeline span:first-of-type {
        border-radius: 5px 0 0 5px;
      }

      .timeline span:last-of-type {
        border-radius: 0 5px 5px 0;
      }

      .knob {
        position: absolute;
        top: -11px;
        left: 41%;
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--text);
        box-shadow: 0 4px 14px rgb(0 0 0 / 0.5);
      }

      .url {
        margin: 0;
        color: var(--muted);
        font-family: 'JetBrains Mono', monospace;
        font-size: 20px;
        font-weight: 500;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <main class="title">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="17" cy="37" r="8" fill="none" stroke="#f5a524" stroke-width="4" />
        <circle cx="17" cy="37" r="2.2" fill="#f5a524" />
        <path
          d="M20.6 45.2 L30.8 59.7 L53 14.6 L51 13.4 L29.2 44.3 L24.4 41.8 Z"
          fill="#f5a524"
          stroke="#f5a524"
          stroke-width="1.5"
          stroke-linejoin="round"
        />
      </svg>
      <h1>What makes it <span>tick</span></h1>
      <p class="subtitle">Interactive 3D explainers of how things work</p>
    </main>
    <footer class="footer">
      <div class="timeline">
        <span style="--grow: 5; --color: #f5c451"></span>
        <span style="--grow: 2; --color: #ff9f43"></span>
        <span style="--grow: 1; --color: #ff7eb6"></span>
        <span style="--grow: 3; --color: #4cc3ff"></span>
        <span style="--grow: 7; --color: #4fd1c5"></span>
        <span style="--grow: 3; --color: #c792ea"></span>
        <span style="--grow: 2; --color: #8bd47f"></span>
        <div class="knob"></div>
      </div>
      <p class="url">whatmakesittick.github.io</p>
    </footer>
    <script>
      Promise.all([
        document.fonts.ready,
        ...[...document.images].map((image) => image.decode()),
      ]).then(() => document.body.setAttribute('data-ready', ''));
    </script>
  </body>
</html>
