<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>What makes it tick: social card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap"
    />
    <style>
      :root {
        --background: #0b0d10;
        --text: #e6e9ee;
        --prose: #c3c9d2;
        --muted: #8b929c;
        --accent: #f5a524;
      }

      body {
        position: relative;
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        color: var(--text);
        background: var(--background);
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .covers {
        position: absolute;
        top: 117px;
        right: 40px;
        display: grid;
        grid-template-columns: repeat(2, 256px);
        grid-auto-rows: 192px;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .cover {
        position: relative;
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 0.12);
        border-radius: 14px;
        background: var(--background);
        box-shadow: 0 18px 40px rgb(0 0 0 / 0.45);
      }

      .cover img {
        position: absolute;
        top: var(--top);
        left: var(--left);
        width: var(--width);
      }

      .cover.faded::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse 90px 70px at 100% 0,
          var(--background) 60%,
          transparent
        );
      }

      .cover span {
        position: absolute;
        z-index: 1;
        bottom: 10px;
        left: 10px;
        padding: 4px 10px;
        border-radius: 999px;
        color: var(--text);
        background: rgb(11 13 16 / 0.78);
        font-size: 14px;
        font-weight: 500;
      }

      .copy {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 72px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 500px;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 0 0 26px;
        color: var(--accent);
        font-size: 24px;
        font-weight: 500;
      }

      .eyebrow img {
        width: 44px;
        height: 44px;
      }

      h1 {
        margin: 0;
        font-size: 80px;
        font-weight: 700;
        line-height: 1.02;
        letter-spacing: -0.035em;
      }

      .subtitle {
        margin: 26px 0 0;
        color: var(--prose);
        font-size: 28px;
        line-height: 1.4;
      }

      .categories {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin: 40px 0 0;
        padding: 0;
        list-style: none;
      }

      .categories li {
        padding: 5px 10px;
        border: 1px solid rgb(255 255 255 / 0.16);
        border-radius: 999px;
        color: var(--muted);
        font-size: 15px;
        font-weight: 500;
      }

      .categories li.live {
        border-color: var(--accent);
        color: var(--text);
      }

      .url {
        position: absolute;
        bottom: 40px;
        left: 72px;
        margin: 0;
        color: var(--muted);
        font-family: 'JetBrains Mono', monospace;
        font-size: 20px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <ul class="covers">
      <li class="cover faded" style="--width: 341px; --left: 0; --top: -46px">
        <img src="../../explainers/engine/public/cover.webp" alt="" />
        <span>Engine</span>
      </li>
      <li class="cover" style="--width: 459px; --left: -89px; --top: -44px">
        <img src="../../explainers/glider/public/cover.webp" alt="" />
        <span>Glider</span>
      </li>
      <li class="cover" style="--width: 373px; --left: 0; --top: -24px">
        <img src="../../explainers/helicopter/public/cover.webp" alt="" />
        <span>Helicopter</span>
      </li>
      <li class="cover" style="--width: 341px; --left: -7px; --top: -48px">
        <img src="../../explainers/sewing-machine/public/cover.webp" alt="" />
        <span>Sewing machine</span>
      </li>
    </ul>
    <main class="copy">
      <p class="eyebrow">
        <img src="../../public/favicon.svg" alt="" />
        Interactive explainers
      </p>
      <h1>What makes it tick</h1>
      <p class="subtitle">How everyday machines work, taken apart in 3D and slowed right down.</p>
      <ul class="categories">
        <li class="live">Engines</li>
        <li>Drivetrain</li>
        <li class="live">Aircraft</li>
        <li>Electrical</li>
        <li class="live">Home</li>
        <li>Tools</li>
      </ul>
    </main>
    <p class="url">whatmakesittick.github.io</p>
    <script>
      Promise.all([
        document.fonts.ready,
        ...[...document.images].map((image) => image.decode()),
      ]).then(() => document.body.setAttribute('data-ready', ''));
    </script>
  </body>
</html>
