<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>How a rocket engine works: social card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap"
    />
    <style>
      :root {
        --background: #070b16;
        --text: #e6e9ee;
        --prose: #c3c9d2;
        --muted: #8b929c;
        --accent: #ff9b3d;
        --start: #9aa7ff;
        --liftoff: #ffb347;
        --climb: #ff8a4c;
        --maxq: #ff5d73;
        --thin: #6fb6ff;
        --cutoff: #b48cff;
        --liquid-oxygen: #a8ecff;
        --liquid-methane: #4f8dff;
        --oxygen-rich-gas: #ffae42;
        --methane-rich-gas: #ff5fa2;
        --flame: #ff9b3d;
      }

      body {
        position: relative;
        width: 1200px;
        height: 630px;
        margin: 0;
        overflow: hidden;
        color: var(--text);
        background: var(--background);
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .shot {
        position: absolute;
        top: 0;
        right: 0;
        width: 640px;
        height: 630px;
        overflow: hidden;
      }

      .shot img {
        position: absolute;
        top: -30px;
        left: -60px;
        width: 1000px;
      }

      .shot::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(to right, var(--background), transparent 120px);
      }

      .copy {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 72px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 500px;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 0 0 26px;
        color: var(--accent);
        font-size: 24px;
        font-weight: 500;
      }

      .eyebrow img {
        width: 44px;
        height: 44px;
      }

      h1 {
        margin: 0;
        font-size: 56px;
        font-weight: 700;
        line-height: 1.02;
        letter-spacing: -0.035em;
      }

      .subtitle {
        margin: 26px 0 0;
        color: var(--prose);
        font-size: 28px;
        line-height: 1.4;
      }

      .topics {
        display: flex;
        gap: 6px;
        margin: 40px 0 0;
        padding: 0;
        list-style: none;
      }

      .topics li {
        flex: 1;
        padding-top: 12px;
        border-top: 5px solid var(--tone);
        color: var(--muted);
        font-size: 17px;
        font-weight: 500;
      }

      .url {
        position: absolute;
        bottom: 40px;
        left: 72px;
        margin: 0;
        color: var(--muted);
        font-family: 'JetBrains Mono', monospace;
        font-size: 20px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="shot">
      <img src="../../explainers/raptor/public/cover.webp" alt="" />
    </div>
    <main class="copy">
      <p class="eyebrow">
        <img src="../../public/favicon.svg" alt="" />
        SpaceX Raptor 3
      </p>
      <h1>How a rocket engine works</h1>
      <p class="subtitle">
        Two turbopumps, two small fires and one big one: how Raptor turns super-cold methane and
        oxygen into 250 tonnes of thrust.
      </p>
      <ol class="topics">
        <li style="--tone: var(--flame)">Thrust</li>
        <li style="--tone: var(--liquid-methane)">Propellants</li>
        <li style="--tone: var(--oxygen-rich-gas)">Pumps</li>
        <li style="--tone: var(--maxq)">Chamber</li>
        <li style="--tone: var(--thin)">Nozzle</li>
        <li style="--tone: var(--cutoff)">Launch</li>
      </ol>
    </main>
    <p class="url">whatmakesittick.github.io/raptor</p>
    <script>
      Promise.all([
        document.fonts.ready,
        ...[...document.images].map((image) => image.decode()),
      ]).then(() => document.body.setAttribute('data-ready', ''));
    </script>
  </body>
</html>
